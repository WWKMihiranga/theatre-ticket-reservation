server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS is configured via a CorsWebFilter bean in GatewayConfig.java
      # (the globalcors property doesn't cover forwarded requests reliably).
      routes:
        # User Service — public auth endpoints
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # User Service — protected user endpoints
        - id: user-profile
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**

        # Theatre Service — shows and seats
        - id: theatre
          uri: ${THEATRE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/shows/**

        # Booking Service
        - id: booking
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings/**

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-key-at-least-256-bits-long-please}
      issuer: theatre-system
    # Paths that don't require a JWT
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.theatre.gateway: INFO
    org.springframework.cloud.gateway: INFO
