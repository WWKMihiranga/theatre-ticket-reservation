server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}?sslmode=require
    username: ${DB_USER:theatre}
    password: ${DB_PASSWORD:theatre_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-key-at-least-256-bits-long-please}
      issuer: theatre-system
  # Theatre Service location (internal Docker network)
  theatre-service:
    base-url: ${THEATRE_SERVICE_URL:http://localhost:8082}
    internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.theatre.booking: INFO
