spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-signing-purposes
      issuer: theatre-system-test
  theatre-service:
    base-url: http://localhost:9999
    internal-token: test-internal-token
