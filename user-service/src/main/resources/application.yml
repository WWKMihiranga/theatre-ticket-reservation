server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}?sslmode=require
    username: ${DB_USER:theatre}
    password: ${DB_PASSWORD:theatre_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-key-at-least-256-bits-long-please}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      issuer: theatre-system

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.theatre.user: INFO
    org.springframework.security: INFO
